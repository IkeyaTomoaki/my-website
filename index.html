<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVGコピー・ダウンロード</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#15182B;font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif}
main{width:min(680px,calc(100% - 40px));margin:0 auto;padding:72px 0}
h1{margin:0 0 12px;font-size:30px;letter-spacing:.01em}
p{margin:0 0 34px;color:#596273;font-size:14px;line-height:1.8}
.panel{border:1px solid #dfe3e8;border-radius:18px;padding:28px;background:#fff;box-shadow:0 12px 34px rgba(21,24,43,.07)}
label{display:block;margin:0 0 8px;font-size:13px;font-weight:700}
input{width:100%;height:48px;border:1px solid #cfd5dd;border-radius:10px;padding:0 14px;font:inherit;color:#15182B;background:#fff;outline:none}
input:focus{border-color:#327FF0;box-shadow:0 0 0 3px rgba(50,127,240,.13)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
button{height:50px;border-radius:10px;border:0;padding:0 18px;font:inherit;font-weight:700;cursor:pointer}
.copy{background:#15182B;color:#fff}.download{background:#A7F536;color:#15182B}
button:hover{filter:brightness(.97)}button:active{transform:translateY(1px)}
.status{height:24px;margin-top:14px;color:#176b3a;font-size:13px;text-align:center}
.note{margin:4px 0 0;color:#7a8391;font-size:11px;text-align:center;line-height:1.6}
@media(max-width:600px){main{padding:40px 0}.actions{grid-template-columns:1fr}.panel{padding:22px}h1{font-size:25px}}
</style>
</head>
<body>
<main>
<h1>SVGデータ</h1>
<p>SVGコードをコピーするか、Illustratorで編集できるSVGファイルとして保存できます。</p>
<section class="panel">
<label for="filename">ダウンロード時のファイル名</label>
<input id="filename" value="nx400-own-line-logo.svg" spellcheck="false">
<div class="actions">
<button class="copy" id="copy">SVGコードをコピー</button>
<button class="download" id="download">SVGをダウンロード</button>
</div>
<div class="status" id="status" aria-live="polite"></div>
<div class="note">IllustratorでSVGを開き、「別名で保存」からAI形式に変換できます。</div>
</section>
</main>
