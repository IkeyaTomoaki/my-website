<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NX400 Night Color Simulator v3</title><style>
:root{--bg:#0b0d12;--p:#151922;--p2:#1e2430;--tx:#f5f3ef;--mu:#9ea8b8;--ln:#303746}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}header{padding:24px 30px;border-bottom:1px solid var(--ln)}h1{margin:0 0 7px;font-size:30px}header p{margin:0;color:var(--mu);line-height:1.5}main{display:grid;grid-template-columns:350px 1fr;gap:18px;padding:18px}aside,.work{background:var(--p);border:1px solid var(--ln);border-radius:18px;padding:18px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#cad2df;margin:20px 0 10px}h2:first-child{margin-top:0}.field{margin:10px 0 14px}label{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;margin-bottom:6px}select,button,input[type=color]{width:100%;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px}input[type=color]{height:40px;padding:4px}input[type=range]{width:100%}button{cursor:pointer;font-weight:700;margin-top:7px}.primary{background:#f1ece5;color:#17191e}.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.presets button{font-size:11px;min-height:52px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px}.card{background:#10141b;border:1px solid var(--ln);border-radius:14px;overflow:hidden}.swatch{height:300px;position:relative;overflow:hidden}.meta{padding:12px}.meta b{display:block}.meta code{font-size:11px;color:var(--mu)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.top h3{margin:0;font-size:22px}.top p{margin:4px 0 0;color:var(--mu);font-size:12px}.note{font-size:11px;line-height:1.55;color:var(--mu);background:#10141b;padding:10px;border-radius:9px;margin-top:10px}.legend{display:flex;gap:6px;flex-wrap:wrap}.chip{width:34px;height:25px;border-radius:6px;border:1px solid #fff3}@media(max-width:950px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.swatch{height:220px}}
</style></head><body><header><h1>NX400 Night Color Simulator</h1><p>9つのカラーパターンと4つの夜間環境を比較し、Illustratorで編集できるSVGへ書き出します。</p></header><main><aside>
<h2>9 Color Patterns</h2><select id="palette"></select><div id="paletteDesc" class="note"></div>
<h2>Base Colors</h2><div id="colorFields"></div>
<h2>Environment</h2><div class="presets"><button data-env="city">Urban Neon</button><button data-env="cafe">Everyday Cafe</button><button data-env="coast">Coastal Night</button><button data-env="mountain">Dark Outskirts</button></div>
<h2>Simulation</h2><div class="field"><label>環境光の強さ <span id="it">48%</span></label><input id="intensity" type="range" min="0" max="100" value="48"></div><div class="field"><label>反射ドット密度 <span id="dt">38%</span></label><input id="density" type="range" min="0" max="100" value="38"></div><div class="field"><label>ドットサイズ <span id="st">10px</span></label><input id="size" type="range" min="1" max="30" value="10"></div><div class="field"><label>ドット間隔 <span id="gt">2px</span></label><input id="gap" type="range" min="0" max="18" value="2"></div><div class="field"><label>混色方式</label><select id="blend"><option value="screen">Screen</option><option value="soft-light">Soft light</option><option value="color-dodge">Color dodge</option><option value="overlay">Overlay</option></select></div>
<h2>Environment Light</h2><div id="legend" class="legend"></div><button id="random">光を再配置</button><button class="primary" id="svgNow">現在の環境をSVG保存</button><button id="svgAll">4環境をSVG保存</button><button id="svgNine">9パターン一覧をSVG保存</button><div class="note">SVGはベースドットと反射ドットを別グループで出力します。Illustratorで開き、.ai形式で保存できます。</div>
</aside><section class="work"><div class="top"><div><h3 id="title"></h3><p id="desc"></p></div><code id="read"></code></div><div id="cards" class="grid"></div></section></main><script>
const palettes=[
{id:'borrowed',name:'01 BORROWED NIGHT',desc:'Quiet Fig / Tamarind Coral / Andaman Petrol。本人の基準、身体の温度、環境と機械。',colors:[['Quiet Fig','#292033'],['Tamarind Coral','#C86757'],['Andaman Petrol','#19363B']]},
{id:'graphite',name:'02 METALLIC NIGHT',desc:'Graphite Bronze / Petrol Green / Black Pearl Navy。上品な金属感と場所ごとの主役変化。',colors:[['Graphite Bronze','#5A4A42'],['Petrol Green','#173B3B'],['Black Pearl Navy','#151D2D']]},
{id:'shift',name:'03 NIGHT SHIFT',desc:'Oxide Vermilion / Deep Petrol / Brushed Silver。都市は赤、海は青緑、山は銀。',colors:[['Oxide Vermilion','#B84F3F'],['Deep Petrol','#173B40'],['Brushed Silver','#A9A5A0']]},
{id:'veil',name:'04 MOON VEIL',desc:'Quiet Fig / Open Apricot / Moon Veil Lavender。内側の温度と外から届く夜光。',colors:[['Quiet Fig','#292033'],['Open Apricot','#F29A72'],['Moon Veil Lavender','#AFA5C8']]},
{id:'open',name:'05 OPEN AFTER DARK',desc:'Quiet Fig / Open Apricot / Reflective Apricot。静かな意思と人を拒まない温度。',colors:[['Quiet Fig','#292033'],['Open Apricot','#F29A72'],['Reflective Apricot','#D98267']]},
{id:'twilight',name:'06 TWILIGHT APRICOT',desc:'Twilight Apricot / Ink Violet / Reflective Apricot。活動性と夜の奥行き。',colors:[['Twilight Apricot','#EE9868'],['Ink Violet','#252238'],['Reflective Apricot','#D77E5A']]},
{id:'moon',name:'07 MOON CITRON',desc:'Moon Citron / Aubergine Black / Reflective Citron。都市的で未来的な夜色。',colors:[['Moon Citron','#D8D56A'],['Aubergine Black','#2B202B'],['Reflective Citron','#C3BD69']]},
{id:'dawn',name:'08 DAWN PEACH',desc:'Dawn Peach / Petrol Navy / Reflective Peach。生活に近い温かさと海岸の深色。',colors:[['Dawn Peach','#EBA786'],['Petrol Navy','#18343B'],['Reflective Peach','#CF9078']]},
{id:'current',name:'09 NIGHT CURRENT',desc:'Night Current Indigo / Human Amber / Encounter Plum。遠距離、乗車視点、境界。',colors:[['Night Current Indigo','#15182B'],['Human Amber','#D88A46'],['Encounter Plum','#6C3A56']]}
];
const envs={city:{title:'Urban Neon',desc:'赤・黄・ピンク・青が重なる密集市街地',bg:'#08070d',lights:['#ff274b','#ffb21d','#ff4ebe','#2b9cff','#f3f0dd']},cafe:{title:'Everyday Cafe',desc:'暖色の生活光と白色街灯',bg:'#15100c',lights:['#ff8a35','#ffd16a','#fff0cf','#ffb06b']},coast:{title:'Coastal Night',desc:'青白い照明、シアン、紫と暗い海',bg:'#061218',lights:['#3dd9ff','#367dff','#a46bff','#e356cc','#d7f3ff']},mountain:{title:'Dark Outskirts',desc:'弱い月光と遠くの暖色',bg:'#040609',lights:['#8da6c8','#d7dfef','#d58b49']}};
let current='city',seed=19,active=0;const $=s=>document.querySelector(s);function rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}function hx(a){return '#'+a.map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('').toUpperCase()}function mix(a,b,t){let A=rgb(a),B=rgb(b);return hx(A.map((v,i)=>v*(1-t)+B[i]*t))}function rnd(i){let x=Math.sin((i+seed)*999.43)*43758.5453;return x-Math.floor(x)}function esc(x){return String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function setup(){palette.innerHTML=palettes.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('');load(0)}function load(i){active=+i;let p=palettes[active];paletteDesc.textContent=p.desc;colorFields.innerHTML=p.colors.map((c,k)=>`<div class="field"><label>${c[0]} <span id="ct${k}">${c[1]}</span></label><input class="color" data-i="${k}" type="color" value="${c[1]}"></div>`).join('');document.querySelectorAll('.color').forEach(x=>x.oninput=render);render()}
function stateColors(){return [...document.querySelectorAll('.color')].map((x,i)=>[palettes[active].colors[i][0],x.value])}function dots(base,index,key,w=600,h=300){let e=envs[key],den=+density.value/100,inten=+intensity.value/100,sz=+size.value,g=+gap.value,step=sz+g,cols=Math.ceil(w/step),rows=Math.ceil(h/step),nrm=[],prl=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=y*cols+x,l=e.lights[Math.floor(rnd(n+index*101)*e.lights.length)],pearl=rnd(n+index*223)<den,t=pearl?mix(base,l,inten*(.42+.58*rnd(n+91))):base;(pearl?prl:nrm).push({x:x*step,y:y*step,s:sz,c:t,l})}return{nrm,prl}}
function card(c,i){let d=dots(c[1],i,current),e=envs[current],r=a=>a.map(q=>`<i style="position:absolute;left:${q.x}px;top:${q.y}px;width:${q.s}px;height:${q.s}px;background:${q.c}"></i>`).join('');return `<article class="card"><div class="swatch" style="background:${e.bg}">${r(d.nrm)}${r(d.prl)}<div style="position:absolute;inset:-15%;background:radial-gradient(circle at 28% 22%,${e.lights[0]}55,transparent 35%),radial-gradient(circle at 75% 70%,${e.lights[1]}44,transparent 40%);mix-blend-mode:${blend.value};opacity:${+intensity.value/100}"></div></div><div class="meta"><b>${c[0]}</b><code>${c[1].toUpperCase()}</code></div></article>`}
function render(){let p=palettes[active],e=envs[current];title.textContent=p.name+' · '+e.title;desc.textContent=e.desc;it.textContent=intensity.value+'%';dt.textContent=density.value+'%';st.textContent=size.value+'px';gt.textContent=gap.value+'px';read.textContent=`PEARL ${density.value}% | LIGHT ${intensity.value}% | DOT ${size.value}px | GAP ${gap.value}px`;cards.innerHTML=stateColors().map(card).join('');legend.innerHTML=e.lights.map(c=>`<span class="chip" title="${c}" style="background:${c}"></span>`).join('')}
function rects(a,id){return `<g id="${id}">`+a.map(q=>`<rect x="${q.x}" y="${q.y}" width="${q.s}" height="${q.s}" fill="${q.c}" data-light="${q.l||''}"/>`).join('')+'</g>'}function panel(c,i,key,x,y,w=600,h=300){let d=dots(c[1],i,key,w,h);return `<g id="${key}-${palettes[active].id}-${i}" transform="translate(${x} ${y})"><rect width="${w}" height="${h}" fill="${envs[key].bg}"/>${rects(d.nrm,'base-dots')}${rects(d.prl,'reflective-dots')}<text y="${h+24}" fill="#111827" font-family="Arial" font-size="18" font-weight="700">${esc(c[0])}</text></g>`}function save(name,text){let a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(new Blob([text],{type:'image/svg+xml'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function svgCurrent(){let cs=stateColors(),W=1960,H=440;return `<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#F5F3EF"/><text x="40" y="42" font-family="Arial" font-size="26" font-weight="700">${esc(palettes[active].name)} · ${esc(envs[current].title)}</text><g transform="translate(40 75)">${cs.map((c,i)=>panel(c,i,current,i*640,0)).join('')}</g></svg>`}function svgAll(){let cs=stateColors(),keys=Object.keys(envs),W=1960,H=1510,rows=keys.map((k,r)=>`<g transform="translate(40 ${55+r*365})"><text y="24" font-family="Arial" font-size="22" font-weight="700">${esc(envs[k].title)}</text><g transform="translate(0 40)">${cs.map((c,i)=>panel(c,i,k,i*640,0)).join('')}</g></g>`).join('');return `<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#F5F3EF"/><text x="40" y="35" font-family="Arial" font-size="26" font-weight="700">${esc(palettes[active].name)} · FOUR ENVIRONMENTS</text>${rows}</svg>`}function svgNine(){let key=current,W=1960,H=3300,rows=palettes.map((p,r)=>{let old=active;active=r;let cs=p.colors;let out=`<g transform="translate(40 ${65+r*355})"><text y="22" font-family="Arial" font-size="21" font-weight="700">${esc(p.name)}</text><g transform="translate(0 38)">${cs.map((c,i)=>panel(c,i,key,i*640,0)).join('')}</g></g>`;active=old;return out}).join('');return `<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#F5F3EF"/><text x="40" y="35" font-family="Arial" font-size="27" font-weight="700">NINE COLOR PATTERNS · ${esc(envs[key].title)}</text>${rows}</svg>`}
palette.onchange=e=>load(e.target.value);document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{current=b.dataset.env;render()});['intensity','density','size','gap','blend'].forEach(id=>$("#"+id).oninput=render);random.onclick=()=>{seed=Math.random()*9999;render()};svgNow.onclick=()=>save(`${palettes[active].id}-${current}.svg`,svgCurrent());svgAll.onclick=()=>save(`${palettes[active].id}-four-environments.svg`,svgAll());svgNine.onclick=()=>save(`nine-patterns-${current}.svg`,svgNine());setup();
</script></body></html>
